name: wake-daily-post

# 非公開リポジトリ kuroneko-sns-autopost の毎日の投稿（daily-x-post）を起こすだけのワークフロー。
# 非公開リポジトリでは GitHub の定時起動が動かないことがあるため、公開リポジトリの定時起動から呼び出す。
# 投稿の中身・店のデータ・キーはここには置かない。
on:
  # 一時停止中（2026-11-08、投稿の質を見直すためオーナーの指示で停止）。再開するときは下の schedule のコメントを外す。
  # schedule:
  #   # 日本時間 17:40 と 17:50 に起こす（投稿側が 18:00 まで待ってから投稿する）。cron はUTCなので -9時間。
  #   # 18:25 と 19:25 は取りこぼしたときの予備（投稿済みなら投稿側がすぐ終わる）。
  #   - cron: "40 8 * * *"
  #   - cron: "50 8 * * *"
  #   - cron: "25 9 * * *"
  #   - cron: "25 10 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 毎日の投稿を起こす
        env:
          GH_TOKEN: ${{ secrets.AUTOPOST_DISPATCH_TOKEN }}
        run: gh workflow run daily-post.yml -R Asuka-ai-Suzuki/kuroneko-sns-autopost --ref main -f dry_run=false

      - name: このワークフローが60日の休眠で止められないようにする
        # 公開リポジトリの定時起動は、60日間動きがないと自動で止まるため、毎回「有効」にし直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wake.yml/enable"
